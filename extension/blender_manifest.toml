schema_version = "1.0.0"

id = "uvunwrap"
version = "0.1.0"
name = "uvunwrap"
tagline = "Fast lightmap and atlas UVs with no overlaps or folds"
maintainer = "Joshua Flark <joshuajmark@gmail.com>"
type = "add-on"
website = "https://github.com/archonic/uvunwrap-blender"
tags = ["UV", "Bake"]

blender_version_min = "4.2.0"

platforms = ["linux-x64", "macos-arm64", "macos-x64", "windows-x64"]

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Joshua Flark"]

# The uvunwrap Python package (MIT), one abi3 wheel per platform, downloaded
# from PyPI by scripts/fetch_wheels.py.
wheels = [
  "./wheels/uvunwrap-0.2.0-cp311-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl",
  "./wheels/uvunwrap-0.2.0-cp311-abi3-macosx_11_0_arm64.whl",
  "./wheels/uvunwrap-0.2.0-cp311-abi3-macosx_10_12_x86_64.whl",
  "./wheels/uvunwrap-0.2.0-cp311-abi3-win_amd64.whl",
]

[build]
paths_exclude_pattern = ["__pycache__/", "/.*"]
