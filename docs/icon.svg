<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- uvunwrap icon: charts packed on a UV page, one nested inside a ring. -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse" x="20" y="20">
      <path d="M24 0H0V24" fill="none" stroke="#3a3f4b" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="256" height="256" rx="44" fill="#1f2229"/>
  <rect x="20" y="20" width="216" height="216" rx="10" fill="#2a2e37"/>
  <rect x="20" y="20" width="216" height="216" rx="10" fill="url(#grid)"/>
  <!-- A ring (a torus's chart) with a chart nested in its hole. -->
  <path d="M88 64a56 56 0 1 0 0.01 0zM88 94a26 26 0 1 1 -0.01 0z" fill="#e8964a" fill-rule="evenodd" transform="translate(-4 52)"/>
  <path d="M74 154l14-14 14 14-14 14z" fill="#5cc8c0"/>
  <!-- A long strip and a blob, packed beside the ring. -->
  <rect x="152" y="34" width="70" height="26" rx="6" fill="#5cc8c0"/>
  <path d="M154 74h60c6 0 8 4 8 10v40c0 10-8 14-16 12l-20-6c-8-2-14 2-22 2-8 0-12-6-12-14v-34c0-6 2-10 2-10z" fill="#9b8cf0"/>
  <path d="M158 150h56a8 8 0 0 1 8 8v54a8 8 0 0 1-8 8h-36l-20-24v-38a8 8 0 0 1 0-8z" fill="#e8964a"/>
  <rect x="34" y="34" width="104" height="26" rx="6" fill="#9b8cf0"/>
</svg>
